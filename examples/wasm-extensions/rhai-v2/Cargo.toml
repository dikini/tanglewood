[package]
name = "tanglewood-rhai-v2-guest"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen.workspace = true
serde = { version = "1", features = ["derive"] }
rhai = { version = "=1.27.0", default-features = false, features = ["std", "serde"] }
