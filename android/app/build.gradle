plugins { id 'com.android.application' }

def abi = providers.gradleProperty('androidAbi').getOrElse('arm64-v8a')
if (!(abi in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException('Use one representative ABI: arm64-v8a or x86_64')
}
android {
    namespace 'org.tanglewood'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'org.tanglewood.Tanglewood'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters abi }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    sourceSets {
        debug.jniLibs.srcDirs = [layout.buildDirectory.dir('rust/debug')]
        release.jniLibs.srcDirs = [layout.buildDirectory.dir('rust/release')]
    }
}

['debug', 'release'].each { profile ->
    def taskName = "buildRust${profile.capitalize()}"
    def nativeOutput = layout.buildDirectory.dir("rust/${profile}")
    tasks.register(taskName, Exec) {
        workingDir rootProject.projectDir.parentFile
        inputs.files(fileTree('../../src') { include '**/*.rs' })
        inputs.files('../../Cargo.toml', '../../Cargo.lock', '../../rust-toolchain.toml', '../build-rust.sh')
        inputs.property('abi', abi)
        outputs.file(nativeOutput.map { it.file("${abi}/libtanglewood.so") })
        commandLine 'bash', rootProject.file('build-rust.sh').absolutePath,
            abi, profile, nativeOutput.get().asFile.absolutePath
    }
    tasks.configureEach { task ->
        if (task.name == "merge${profile.capitalize()}JniLibFolders") {
            task.dependsOn(taskName)
        }
    }
}
