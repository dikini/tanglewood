[package]
name = "tanglewood"
version = "0.1.0"
edition = "2024"

[features]
default = []
gui = ["dep:eframe"]

[dependencies]
bevy_ecs = { version = "0.18", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
fs2 = "0.4"
pulldown-cmark = "0.13"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
