[package]
name = "tanglewood"
version = "0.1.0"
edition = "2024"
default-run = "tanglewood"

[features]
default = []
gui = ["dep:eframe", "dep:jni"]
sync = ["dep:automerge", "dep:serde_json"]
lan = ["sync", "dep:quinn", "dep:rustls", "dep:rcgen", "dep:sha2", "dep:tokio"]
mcp = ["dep:rmcp", "dep:tokio", "dep:serde_json", "dep:schemars", "dep:libc"]
codex = ["mcp"]

[dependencies]
bevy_ecs = { version = "0.18", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
fs2 = "0.4"
pulldown-cmark = "0.13"
automerge = { version = "=0.7.4", optional = true }
schemars = { version = "1", optional = true, features = ["uuid1"] }
serde_json = { version = "1", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std", "sync", "time", "net", "io-util"] }
quinn = { version = "=0.11.9", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.43", optional = true, default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.7", optional = true, default-features = false, features = ["crypto", "ring"] }
sha2 = { version = "0.11", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", optional = true }
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }

winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }
android_logger = "0.15.1"
log = "0.4"

[lib]
crate-type = ["lib", "cdylib"]

[package.metadata.android]
package = "org.tanglewood.Tanglewood"
apk_name = "tanglewood"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[package.metadata.android.application]
label = "Tanglewood"

[target.'cfg(target_os = "linux")'.dependencies]
rmcp = { version = "=3.7.0", optional = true, default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
libc = { version = "0.2", optional = true }

[[bin]]
name = "tanglewood-mcp"
path = "src/bin/tanglewood-mcp.rs"
required-features = ["mcp"]
